name: Destroy app stack

on:
  workflow_dispatch:

env:
 STATE_FILE: "terraform/terraform.tfstate"

jobs:
  destroy_stack:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions: write-all

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v7

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v4

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      working-directory: terraform
      run: terraform init

    # Generates an execution plan for Terraform
    - name: Terraform Destroy
      working-directory: terraform
      if: hashFiles(env.STATE_FILE) != ''
      run: terraform destroy -auto-approve
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    # Save the destroyed state
    - name: Update the Terraform deployment state
      working-directory: terraform
      if: hashFiles(env.STATE_FILE) != ''
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git add terraform.tfstate
        if ! git diff --cached --quiet ${STATE_FILE}; then
          git commit -m "chore: automated terrafrom state update"
          git push
        else
          echo "No state changes detected, skipping commit"
        fi
